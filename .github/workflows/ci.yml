name: CI

on:
  push:
    branches:
      - 'master'
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - 'master'
  schedule:
    - cron: '17 8 * * 0'

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.13'
        cache: 'pip'
        cache-dependency-path: |
          requirements.txt
          requirements-dev.txt
    - run: pip install -r requirements-dev.txt
    - run: python3 -m pytest --junitxml=test-report.xml
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: Test Results
        path: |
          test-report.xml

  docker:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io
      IMAGENAME: ghcr.io/${{ github.repository }}/zpf-backstage-tv

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: |
          ${{ env.IMAGENAME }}
        # generate Docker tags based on the following events/attributes
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=sha,format=long

    - name: Set up QEMU
      uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

    - name: Login to DockerHub
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Determine version string
      run: |
        VERSION=$(git describe --tags --match 'v*' --dirty)
        echo "determined version: $VERSION"
        # simple sanity check
        echo $VERSION | grep "^v"
        echo "VERSION=$VERSION" >> $GITHUB_ENV

    - name: Build and push Docker images
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        build-args: |
          VERSION=${{ env.VERSION }}
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=registry,ref=${{ env.IMAGENAME }}:buildcache
        cache-to: type=registry,ref=${{ env.IMAGENAME }}:buildcache,mode=max

  # needed by test results workflow
  event_file:
    name: "Event File"
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
    - name: Upload
      uses: actions/upload-artifact@v7
      with:
        name: Event File
        path: ${{ github.event_path }}

  docker-smoke-test:
    name: "Docker Smoke Test"
    runs-on: ${{ matrix.runner }}
    needs: docker
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64

    permissions:
      contents: read
      packages: read

    env:
      REGISTRY: ghcr.io
      IMAGENAME: ghcr.io/${{ github.repository }}/zpf-backstage-tv

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
        cache: 'pip'
        cache-dependency-path: |
          requirements.txt
          requirements-dev.txt

    - name: Install dependencies
      run: pip install -r requirements-dev.txt

    - name: Login to GHCR
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Pull Docker image
      run: |
        docker pull --platform linux/${{ matrix.arch }} ${{ env.IMAGENAME }}:sha-${{ github.sha }}

    - name: Run smoke tests on Docker image
      env:
        DOCKER_IMAGE: ${{ env.IMAGENAME }}:sha-${{ github.sha }}
      run: python3 -m pytest test/test_smoke.py -v --docker-app --junitxml=docker-test-report-${{ matrix.arch }}.xml

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: Test Results
        path: |
          docker-test-report-${{ matrix.arch }}.xml
